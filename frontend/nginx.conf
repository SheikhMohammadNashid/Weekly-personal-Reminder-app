server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ─────────────────────────────────────────────
    # All /api/ requests go to the backend container.
    # nginx handles CORS here so the backend never sees a preflight.
    location /api/ {

        # Catch OPTIONS preflight and return 204 immediately.
        # Backend never sees it — no CORS rejection possible.
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept';
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }

        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Add CORS header to real responses too (not just preflights)
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # ── Health check proxy ────────────────────────────────────
    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Favicon ───────────────────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log    off;
        try_files $uri =204;
    }

    # ── JS + CSS: never serve stale files after a deploy ──────
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
    }

    # ── Static HTML + assets ──────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }
}
